[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lasimeri/xks-toolintercept-folder_mngmt"

[workspace.dependencies]
# The base, client side only: the System One wire types and the HTTP client of
# a running `jevbase serve`. No model and no llama.cpp in these binaries.
jevbase = { package = "xks-jev-base", git = "https://github.com/Lasimeri/XKS_Jev-like_Model_Base", tag = "v0.1.0-rc.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
